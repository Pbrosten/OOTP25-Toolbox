        team_id:
          type: integer
        retired:
          type: boolean
          description: True once the player has retired in-game. Retired players' ratings/team/age stop receiving updates; this flag is the only signal that their data is frozen.

    PlayerRating:
      type: object
      properties:
        rating_id:
          type: integer
        player_id:
          type: integer
        rating_date:
          type: string
          format: date

    RatingTrendEntry:
      type: object
      description: One rating column's delta between a player's latest heap and the heap 3 heaps prior (ticket 0050).
      properties:
        table_name:
          type: string
          description: Source rating table, e.g. players_batting or players_batting_talent
        column_name:
          type: string
          description: Rating column within table_name, e.g. contact
        from_date:
          type: string
          format: date
          description: rating_date of the heap 3 heaps prior
        to_date:
          type: string
          format: date
          description: rating_date of the player's latest heap
        from_value:
          type: integer
        to_value:
          type: integer
        delta:
          type: integer
          description: to_value minus from_value
        threshold:
          type: integer
          description: 5 for overall-table rows, 10 for talent-table rows
        exceeded:
          type: boolean
          description: True if abs(delta) >= threshold

    DevelopmentAlert:
      type: object
      description: A narrative alert built from one exceeded RatingTrendEntry (ticket 0051).
      properties:
        table:
          type: string
          description: Source rating table, e.g. players_batting or players_batting_talent
        column:
          type: string
          description: Rating column within table, e.g. contact
        direction:
          type: string
          enum: [improved, declined]
        delta:
          type: integer
        message:
