openapi: 3.0.0
info:
  title: Player API
  version: 1.0.0
paths:
  /api/players:
    get:
      summary: Retrieve players
      description: |
        Returns a list of all players, or a specific player if the `player_id` query parameter is provided.
      tags: [Players]
      parameters:
        - in: query
          name: player_id
          schema:
            type: integer
          required: false
          description: The ID of the player to retrieve
      responses:
        '200':
          description: A list of players or a single player
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/Player'
                  - $ref: '#/components/schemas/Player'
        '404':
          description: Player not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/players/{player_id}:
    get:
      summary: Retrieve a single player by ID
      description: Returns detailed info for a specific player.
      tags: [Players]
      parameters:
        - in: path
          name: player_id
          required: true
          schema:
            type: integer
          description: The ID of the player to retrieve
      responses:
        '200':
          description: Player found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '404':
          description: Player not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  
  /api/players/{player_id}/career/pitching:
    get:
      summary: Retrieve a player's career pitching stats, by season
      description: |
        Returns one row per season/team of raw career pitching counting
        stats. Automatically selects the MLB-only or MiLB-only variant
        based on whether the player has any MLB (league_id 203) rows.
      tags: [Players, Pitching]
      parameters:
        - in: path
          name: player_id
          required: true
          schema:
            type: integer
          description: The ID of the player to retrieve
      responses:
        '200':
          description: List of career pitching stat rows, one per season/team
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PitchingCareerStats'
        '404':
          description: Player not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/players/stats/expected/batting:
    get:
      summary: Retrieve all player expected batting stat entries
      tags: [Projections, Batting]
      responses:
        '200':
          description: List of expected batting stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BattingExpected'

  /api/players/stats/expected/batting/{rating_id}:
    get:
      summary: Retrieve batting expected stats by ID
      tags: [Projections, Batting]
      parameters:
        - name: rating_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Player batting expected stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BattingExpected'
        '404':
          description: Not found

  /api/players/stats/expected/pitching:
    get:
      summary: Retrieve all player expected pitching stat entries
      tags: [Projections, Pitching]
      responses:
        '200':
          description: List of expected pitching stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PitchingExpected'

  /api/players/stats/expected/pitching/{rating_id}:
    get:
      summary: Retrieve pitching expected stats by ID
      tags: [Projections, Pitching]
      parameters:
        - name: rating_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Player pitching expected stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PitchingExpected'
        '404':
          description: Not found

  /api/players/stats/expected/basepath:
    get:
      summary: Retrieve all basepath expected stats
      tags: [Projections, Basepath]
      responses:
        '200':
          description: List of expected basepath stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BasepathExpected'

  /api/players/stats/expected/basepath/{rating_id}:
    get:
      summary: Retrieve basepath expected stats by ID
      tags: [Projections, Basepath]
      parameters:
        - name: rating_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Player basepath expected stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasepathExpected'
        '404':
          description: Not found

  /api/players/stats/expected/fielding:
    get:
      summary: Retrieve all fielding expected stats
      description: Returns a list of all player rating records.
      tags: [Projections, Fielding]
      responses:
        '200':
          description: List of expected fielding stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FieldingExpected'

  /api/players/stats/expected/fielding/{rating_id}:
    get:
      summary: Retrieve fielding expected stats by ID
      description: Returns a list of all player rating records.
      tags: [Projections, Fielding]
      parameters:
        - in: path
          name: rating_id
          required: true
          description: The ID of the rating to retrieve
          schema:
            type: integer
      responses:
        '200':
          description: Player fielding expected stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldingExpected'
        '404':
          description: Rating not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/ratings:
    get:
      summary: Get all player ratings
      description: Returns a list of all player rating records.
      tags: [Ratings]
      responses:
        '200':
          description: A list of player ratings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlayerRating'

  /api/ratings/{rating_id}:
    get:
      summary: Get a specific rating by ID
      description: Returns a player rating record by its unique rating ID.
      tags: [Ratings]
      parameters:
        - in: path
          name: rating_id
          required: true
          description: The ID of the rating to retrieve
          schema:
            type: integer
      responses:
        '200':
          description: Rating found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerRating'
        '404':
          description: Rating not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                
  /api/ratings/batting:
    get:
      summary: Get all player batting ratings
      description: Returns a list of all player batting rating records.
      tags: [Ratings, Batting]
      responses:
        '200':
          description: A list of batting ratings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BattingRating'

  /api/ratings/batting/{rating_id}:
    get:
      summary: Get a specific batting rating by ID
      description: Returns a single batting rating entry by rating ID.
      tags: [Ratings, Batting]
      parameters:
        - in: path
          name: rating_id
          required: true
          description: The unique ID of the batting rating entry
          schema:
            type: integer
      responses:
        '200':
          description: Batting rating found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BattingRating'
        '404':
          description: Rating not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/ratings/basepath:
    get:
      summary: Get all player basepath ratings
      description: Returns a list of all player basepath rating records.
      tags: [Ratings, Basepath]
      responses:
        '200':
          description: A list of basepath ratings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BasepathRating'

  /api/ratings/basepath/{rating_id}:
    get:
      summary: Get a specific basepath rating by ID
      description: Returns a basepath rating entry by its unique rating ID.
      tags: [Ratings, Basepath]
      parameters:
        - in: path
          name: rating_id
          required: true
          description: The ID of the basepath rating entry
          schema:
            type: integer
      responses:
        '200':
          description: Basepath rating found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasepathRating'
        '404':
          description: Rating not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  
  /api/ratings/fielding:
    get:
      summary: Get all player fielding ratings
      description: Returns a list of all player fielding rating records.
      tags: [Ratings, Fielding]
      responses:
        '200':
          description: A list of fielding ratings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FieldingRating'

  /api/ratings/fielding/{rating_id}:
    get:
      summary: Get a specific fielding rating by ID
      description: Returns a fielding rating entry by its unique rating ID.
      tags: [Ratings, Fielding]
      parameters:
        - in: path
          name: rating_id
          required: true
          schema:
            type: integer
          description: The rating ID to look up
      responses:
        '200':
          description: Fielding rating found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldingRating'
        '404':
          description: Rating not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/ratings/positions:
    get:
      summary: Get all player position ratings
      description: Returns a list of all player position rating records.
      tags: [Ratings, Fielding]
      responses:
        '200':
          description: A list of position ratings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PositionRating'

  /api/ratings/positions/{rating_id}:
    get:
      summary: Get a specific position rating by ID
      description: Returns a position rating entry by its unique rating ID.
      tags: [Ratings, Fielding]
      parameters:
        - in: path
          name: rating_id
          required: true
          schema:
            type: integer
          description: The rating ID to look up
      responses:
        '200':
          description: Position rating found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionRating'
        '404':
          description: Rating not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/ratings/pitch_repertoire:
    get:
      summary: Get all pitch repertoire entries
      description: Returns a list of all pitch repertoire records (one row per pitch type a player throws).
      tags: [Ratings, Pitching]
      responses:
        '200':
          description: A list of pitch repertoire entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PitchRepertoireEntry'

  /api/ratings/pitch_repertoire/{rating_id}:
    get:
      summary: Get the pitch repertoire for a rating ID
      description: Returns all pitch repertoire entries for a given rating ID. Unlike other rating-by-id routes, rating_id is not unique in this table, so this always returns a list (possibly empty), never a single object or a 404.
      tags: [Ratings, Pitching]
      parameters:
        - in: path
          name: rating_id
          required: true
          schema:
            type: integer
          description: The rating ID to look up
      responses:
        '200':
          description: Pitch repertoire entries for the given rating ID (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PitchRepertoireEntry'

  /api/players/ratings/{player_id}/trends:
    get:
      summary: Get a player's rating deltas over the last 3 heaps
      description: |
        Returns per-category rating deltas for a player: their latest heap's
        ratings vs. the ratings from 3 heaps prior (the player's own heap
        sequence, not a fixed calendar offset). Tracked categories are
        curated per player type (ticket 0050, restricted after initial
        release): position players get babip, power, eye, speed, and
        defense (infield range, outfield range, catcher framing); pitchers
        get stuff, movement, control, velocity, and stamina. For the
        categories with both an "overall" (current-ability) and "talent"
        (potential) rating -- babip/power/eye for batters, stuff/movement/
        control for pitchers -- the overall rating is tracked once the
        player has reached the majors (latest heap's league_id = 203),
        talent until then; velocity/stamina/speed/defense always track
        overall, having no talent-table equivalent. Each overall-table
        delta is flagged `exceeded` at +/-5 points; each talent-table delta
        at +/-10 points. Note this route lives under `/api/players/ratings`,
        not `/api/ratings` like the other Ratings-tagged routes in this
        file above.
      tags: [Ratings, Development]
      parameters:
        - in: path
          name: player_id
          required: true
          description: The ID of the player to compute rating trends for
          schema:
            type: integer
      responses:
        '200':
          description: Rating deltas for the player (empty if fewer than 4 recorded heaps)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RatingTrendEntry'
        '404':
          description: Player has no players_rating rows at all
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/players/ratings/{player_id}/trends/alerts:
    get:
      summary: Get a player's narrative development alerts
      description: |
        Returns the subset of `/trends` rows that exceeded 0050's threshold,
        turned into short human-readable text (ticket 0051), e.g. "Stuff
        has improved." or "Scouts have revised power potential downward."
        Talent-table rows use distinct wording from overall-table rows to
        signal a scouting-ceiling revision rather than actual current-
        ability change. No claim about age-relative pace or whether
        production followed is made — both are out of scope for v1 (see
        0044/0051's Design choices).
      tags: [Ratings, Development]
      parameters:
        - in: path
          name: player_id
          required: true
          description: The ID of the player to compute development alerts for
          schema:
            type: integer
      responses:
        '200':
          description: Development alerts for the player (empty if nothing exceeded threshold)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DevelopmentAlert'
        '404':
          description: Player has no players_rating rows at all
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/admin/init-db:
    post:
      summary: Initialize the database schema
      description: |
        (Re)creates the database schema from schema.sql. Destructive —
        drops and recreates tables.
      tags: [Admin]
      security:
        - AdminToken: []
      responses:
        '200':
          description: Schema initialized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '401':
          description: Missing or invalid X-Admin-Token header
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Initialization failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/admin/update-db:
    post:
      summary: Start the database update process
      description: |
        Ingests any new dump heaps found under DUMP_PATH and runs the
        migration/projection pipeline as a background job — this can take
        anywhere from seconds to minutes, so the request returns immediately
        with a job id instead of blocking. No request parameters — mirrors
        `flask update-db` exactly. Poll `GET /api/admin/jobs/{job_id}` for
        the result. Only one update-db job may run at a time.
      tags: [Admin]
      security:
        - AdminToken: []
      responses:
        '202':
          description: Job started
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
        '401':
          description: Missing or invalid X-Admin-Token header
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '409':
          description: A job is already pending/running
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  job_id:
                    type: string
                    description: The id of the job already in progress.

  /api/admin/jobs/{job_id}:
    get:
      summary: Retrieve the status of an update-db job
      description: |
        Returns the current status of a job started via
        `POST /api/admin/update-db`. `result` is populated once `status` is
        `succeeded`; `error` is populated once `status` is `failed`.
      tags: [Admin]
      security:
        - AdminToken: []
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
          description: The job id returned by POST /api/admin/update-db
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  status:
                    type: string
                    enum: [pending, running, succeeded, failed]
                  result:
                    type: object
                    nullable: true
                    properties:
                      status:
                        type: string
                      heaps_processed:
                        type: integer
                      long_heaps:
                        type: integer
                      short_heaps:
                        type: integer
                      ratings_inserted:
                        type: integer
                        description: Rows actually written (cursor.rowcount, not rows attempted) across all short-heap ratings-detail INSERT IGNORE statements.
                      players_updated:
                        type: integer
                        description: Rows actually written across long-heap players/teams/career-stats upserts plus the player-age UPDATE pass.
                      projections_inserted:
                        type: integer
                        description: Rows actually written into the *_expected and players_run_value tables by the projection pass.
                  error:
                    type: string
                    nullable: true
                  started_at:
                    type: string
                    format: date-time
                  logs:
                    type: array
                    items:
                      type: string
                    description: |
                      Log lines emitted by this job's pipeline run, in order,
                      formatted the same way as the server console (e.g.
                      "[2026-03-01 12:00:00,000] INFO in update: [27/76]
                      Processing short heap: 2026_03"). Grows as the job
                      progresses; re-poll to get new lines.
        '401':
          description: Missing or invalid X-Admin-Token header
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: No job exists with that id
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/teams:
    get:
      summary: Retrieve every real MLB team
      description: |
        Returns every level-1 team that is also a real franchise (has a
        real city -- excludes this save's 4 exhibition teams: AL/NL
        All-Stars, AL/NL Future Stars, see ticket 0062/0064), sorted by
        name. Used by the depth-chart team picker.
      tags: [Teams]
      responses:
        '200':
          description: List of real MLB teams
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    team_id:
                      type: integer
                    name:
                      type: string
                    abbr:
                      type: string
                    nickname:
                      type: string

  /api/teams/{team_id}/depth-chart:
    get:
      summary: Retrieve an org's full depth chart
      description: |
        Returns the given MLB team's roster plus its AAA/AA/A/Rookie
        affiliates (teams.parent_team_id/level, ticket 0062), grouped by
        level and position (pitchers split into SP/RP). MLB/AAA/AA groups
        are sorted by projected WAR descending; A/Rookie groups are plain
        roster counts (ticket 0064 -- WAR isn't a meaningful ranking
        signal that far from MLB-readiness). team_id must be a level-1
        (MLB) team.
      tags: [Teams]
      parameters:
        - in: path
          name: team_id
          required: true
          schema:
            type: integer
          description: The MLB team's id (must be a level-1 team)
      responses:
        '200':
          description: The org's depth chart
          content:
            application/json:
              schema:
                type: object
                properties:
                  team_id:
                    type: integer
                  team_name:
                    type: string
                  background_color:
                    type: string
                    description: The MLB team's real color (teams.background_color), for frontend theming.
                  text_color:
                    type: string
                  levels:
                    type: object
                    description: |
                      Keyed by teams.level (as a string key: "1" = MLB,
                      "2" = AAA, "3" = AA, "4" = A/High-A, "6" =
                      Rookie/Complex -- "5" never appears, see ticket
                      0062). Each level maps to an object keyed by
                      position (e.g. "1B", "SS") or "SP"/"RP" for
                      pitchers. For levels 1/2/3, each key holds a
                      WAR-descending array of players; for levels 4/6,
                      each key holds a plain roster-count integer instead
                      (ticket 0064).
                    additionalProperties:
                      type: object
                      additionalProperties:
                        oneOf:
                          - type: integer
                            description: Roster count (levels 4/6 only).
                          - type: array
                            items:
                              type: object
                              properties:
                                player_id:
                                  type: integer
                                first_name:
                                  type: string
                                last_name:
                                  type: string
                                team_id:
                                  type: integer
                                team_abbr:
                                  type: string
                                  description: Distinguishes affiliate teams that share the same level.
                                war:
                                  type: number
                                  nullable: true
                                  description: Null for a two-way player (never-net-batting/pitching-WAR precedent, ticket 0056) or a player with no current rating.
                                is_promotion_candidate:
                                  type: boolean
                                  description: Top 20% of WAR at this player's level, computed league-wide (all orgs), AAA/AA only -- always false at MLB (ticket 0064).
        '404':
          description: team_id isn't a real level-1 MLB team
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/prospects:
    get:
      summary: Retrieve every prospect-eligible player
      description: |
        Returns every player currently on a non-MLB affiliate
        (teams.level != 1), plus just-debuted MLB rookies with zero
        recorded MLB service (players_service_time.mlb_service_years = 0)
        -- see ticket 0043's Design choices for the full "prospect"
        definition. Each prospect's Future Value (FV) grade, surplus
        value, and MLB-promotion readiness are computed by replicating
        FanGraphs' Future Value framework against this app's own
        talent/current ratings (ticket 0068); development trend reuses
        ticket 0050/0051's rating-delta/alert layer.
      tags: [Prospects]
      parameters:
        - in: query
          name: team_id
          schema:
            type: integer
          required: false
          description: Scope to a single org -- the given MLB team plus every affiliate whose parent_team_id points at it.
        - in: query
          name: position
          schema:
            type: string
          required: false
          description: Scope to a single players.position (e.g. "SS", "P").
        - in: query
          name: level
          schema:
            type: integer
          required: false
          description: Scope to a single teams.level (1 = MLB, 2 = AAA, 3 = AA, 4 = A/High-A, 6 = Rookie/Complex).
      responses:
        '200':
          description: List of prospects
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    player_id:
                      type: integer
                    first_name:
                      type: string
                    last_name:
                      type: string
                    position:
                      type: string
                    age:
                      type: integer
                    team_id:
                      type: integer
                    team_abbr:
                      type: string
                    level:
                      type: integer
                    parent_team_id:
                      type: integer
                      nullable: true
                    mlb_service_years:
                      type: integer
                      nullable: true
                    value:
                      type: object
                      description: |
                        {"available": false} only for a player with no
                        usable rating data -- RP-role prospects get a real
                        value too (their own smaller workload naturally
                        produces a lower WAR/FV, no exclusion needed).
                      properties:
                        available:
                          type: boolean
                        fv:
                          type: integer
                          description: 20-80 Future Value grade off the player's talent-ceiling projection.
                        surplus_value:
                          type: integer
                          description: Expected surplus value in dollars, looked up by FV grade.
                        expected_war:
                          type: number
                        star_odds:
                          type: number
                          description: Percent chance of a multi-4+-WAR-season "star" outcome, by FV grade.
                        current_fv:
                          type: integer
                          description: FV grade off the player's *current* (not talent) ratings.
                        mlb_promotion_ready:
                          type: boolean
                          description: Present only when level != 1 -- true if current_fv >= 40 ("Bench Player"/"Backend starter" or better).
                    trend:
                      type: object
                      properties:
                        direction:
                          type: string
                          enum: [up, down, mixed, flat]
                        alerts:
                          type: array
                          description: Ticket 0051's per-category development alerts (see /api/players/ratings/{player_id}/trends/alerts).
                          items:
                            type: object

  /api/prospects/{player_id}:
    get:
      summary: Retrieve a single player's FV-based prospect value
      description: |
        Ticket 0071: reuses get_prospects.sql (scoped to one player via its
        player_id filter) so the player page can show 0068's FV-based
        prospect value in place of 0056's contract-based surplus value
        whenever the player currently qualifies as a prospect (ticket
        0043's definition).
      tags: [Prospects]
      parameters:
        - in: path
          name: player_id
          required: true
          schema:
            type: integer
          description: The player's id
      responses:
        '200':
          description: |
            {"is_prospect": false} if the player doesn't currently qualify
            as a prospect (the caller should fall back to
            GET /api/players/{player_id}/surplus-value in that case).
            Otherwise the same "value" shape as each row of
            GET /api/prospects, flattened to the top level alongside
            "is_prospect": true. "available" can still be false (missing
            rating data) even when "is_prospect" is true.
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_prospect:
                    type: boolean
                  available:
                    type: boolean
                  fv:
                    type: integer
                  surplus_value:
                    type: integer
                  expected_war:
                    type: number
                  star_odds:
                    type: number
                  current_fv:
                    type: integer
                  mlb_promotion_ready:
                    type: boolean
                    description: Present only when level != 1.

